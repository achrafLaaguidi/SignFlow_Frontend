<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-fadeIn">
      <div class="bg-white rounded-2xl border border-slate-200 shadow-xl w-full max-w-md overflow-hidden p-6 space-y-5">
        
        <!-- Icon & Title -->
        <div class="flex items-start gap-4">
          <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center shrink-0 border border-rose-100">
            <i class="fas fa-exclamation-triangle text-base"></i>
          </div>
          <div>
            <h3 class="text-lg font-bold text-slate-900">{{ title }}</h3>
            <p class="text-sm text-slate-500 mt-1">{{ message }}</p>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-3 pt-2">
          <button 
            type="button" 
            (click)="onCancel()" 
            class="px-4 py-2.5 text-slate-600 hover:bg-slate-100 font-semibold text-sm rounded-xl transition-all cursor-pointer">
            {{ cancelText }}
          </button>
          <button 
            type="button" 
            (click)="onConfirm()" 
            class="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold text-sm rounded-xl shadow-sm transition-all cursor-pointer flex items-center gap-2">
            <i class="fas fa-trash-alt text-xs"></i>
            <span>{{ confirmText }}</span>
          </button>
        </div>

      </div>
    </div>
